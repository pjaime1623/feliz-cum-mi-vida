<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<title>Feliz Cumpleaños</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script&family=Montserrat:wght@400;700&display=swap');

  /* Reset */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: linear-gradient(to bottom, #ffe6e6, #ffcccc);
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    min-height: 600px;
    max-width: 350px;
    margin-left: auto;
    margin-right: auto;
    padding: 20px 15px;
    overflow: hidden;
    user-select: none;
  }

  h1 {
    font-family: 'Dancing Script', cursive;
    color: #b30000;
    font-size: 2.8rem;
    margin-bottom: 5px;
    text-align: center;
    text-shadow: 1px 1px 4px #aa0000cc;
  }

  .poem {
    font-style: italic;
    color: #660000;
    background: rgba(255,230,230,0.8);
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
    font-size: 1rem;
    line-height: 1.5;
    text-align: center;
    box-shadow: 2px 2px 10px rgba(179,0,0,0.3);
  }

  .bouquet {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 340px;
    justify-items: center;
  }

  .rose {
    width: 40px;
    height: 40px;
    cursor: pointer;
    transition: transform 0.3s ease;
    position: relative;
    filter: drop-shadow(0 0 2px #900);
  }

  .rose:hover {
    transform: scale(1.3) rotate(10deg);
    z-index: 10;
  }

  /* Petal fall animation container */
  .petal-fall {
    position: fixed;
    pointer-events: none;
    width: 15px;
    height: 15px;
    background: radial-gradient(circle at center, #cc0000 60%, #660000 90%);
    border-radius: 50% 30% 50% 40% / 60% 70% 40% 50%;
    opacity: 0.8;
    transform-origin: center;
    animation-name: fall;
    animation-timing-function: linear;
  }

  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.8;
    }
    100% {
      transform: translateY(120vh) rotate(360deg);
      opacity: 0;
    }
  }

  /* Scroll lock on mobile */
  @media (max-width: 400px) {
    body {
      max-width: 100vw;
      padding: 15px 10px;
    }
  }
</style>
</head>
<body>
  <h1>¡Feliz Cumpleaños!</h1>
  <div class="bouquet" aria-label="Ramo de rosas rojas con interactividad" role="img">
    <!-- Rose SVG icons will be inserted by JavaScript -->
  </div>
  <div class="poem" aria-live="polite">
    <p><strong>Un ramo rojo te entrego,</strong><br/>
       lleno de amor y deseo.<br/>
       Que tu día sea hermoso,<br/>
       y tu vida, un bello paseo.<br/><br/>
       Feliz cumpleaños, mi vida,<br/>
       mi amor por ti no termina.</p>
  </div>

  <script>
    // Rose SVG icon as a string
    const roseSVG = `
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <circle cx="32" cy="32" r="30" fill="#B30000" />
        <path fill="#F44336" d="M20 25c0 0 8-18 14-10 6 8 0 18 0 18s-6-16-14-8z"/>
        <path fill="#800000" d="M32 10c0 3-10 22-22 22 10 12 30-12 30-22-2 0-8 0-8 0z"/>
      </svg>
    `;

    // Insert multiple roses in bouquet
    const bouquet = document.querySelector('.bouquet');
    const roseCount = 28; // Enough to fill bouquet nicely in 7 columns

    for (let i = 0; i < roseCount; i++) {
      const roseDiv = document.createElement('div');
      roseDiv.className = 'rose';
      roseDiv.tabIndex = 0;
      roseDiv.innerHTML = roseSVG;
      roseDiv.setAttribute('aria-label', 'Rosa roja, haz clic para una sorpresa');
      bouquet.appendChild(roseDiv);
    }

    // Petal falling effect on rose click
    function createPetal(x, y) {
      const petal = document.createElement('div');
      petal.className = 'petal-fall';
      document.body.appendChild(petal);
      petal.style.left = `${x}px`;
      petal.style.top = `${y}px`;
      // Random animation duration to vary the petal falling speed
      const duration = 3000 + Math.random() * 2000;
      petal.style.animationDuration = duration + 'ms';

      // Random horizontal sway motion
      petal.animate([
        { transform: 'translateX(0) rotate(0deg)' },
        { transform: `translateX(${Math.random()*30 - 15}px) rotate(${Math.random()*360}deg)` }
      ], {
        duration: duration,
        iterations: 1,
        easing: 'ease-out'
      });

      setTimeout(() => {
        petal.remove();
      }, duration);
    }

    bouquet.addEventListener('click', (event) => {
      if (event.target.closest('.rose')) {
        const rect = event.target.getBoundingClientRect();
        // Create multiple petals falling from rose position
        for (let i = 0; i < 7; i++) {
          const x = rect.left + rect.width/2 + (Math.random()*20-10);
          const y = rect.top + rect.height/2 + (Math.random()*20-10);
          createPetal(x, y);
        }
      }
    });

    // Also trigger petals on keyboard Enter or Space key for accessibility
    bouquet.addEventListener('keydown', (event) => {
      if ((event.key === 'Enter' || event.key === ' ') && event.target.classList.contains('rose')) {
        event.preventDefault();
        event.target.click();
      }
    });
  </script>
</body>
</html>
