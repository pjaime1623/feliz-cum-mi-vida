    <title>Cumpleaños mi niña</title>
    <style>
        body {
            background-color: pink; /* Fondo rosa */
        }

        .balloon {
            width: 120px; /* Aumentar el ancho */
            height: 150px; /* Mantener la altura */
            background-color: red;
            border-radius: 60px; /* Hacer los globos más redondeados */
            position: relative;
            display: inline-block;
            margin: 20px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .balloon:hover {
            transform: scale(1.1);
        }

        .balloon:after {
            content: '';
            width: 10px;
            height: 50px;
            background-color: red;
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
        }

        .confetti {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background: url("confeti.png") no-repeat center center;
            background-size: cover;
            pointer-events: none;
        }

        .balloon:hover .confetti {
            display: block;
        }

        .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 30px;
        }

        .photo-gallery img {
            width: 350px;
            height: 550px;
            margin: 10px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }
    </style>
</head>
